name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The pinned dd runtime sets up MSVC and uses the bundled CMake and Ninja.
      # A CTest label skips dd's desktop smoke pass on the hosted runner.
      - name: Build and test
        shell: pwsh
        run: .\dd.ps1 test --label unit --non-interactive
